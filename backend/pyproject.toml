[project]
name = "backend"
version = "0.0.0"
description = "A self-hosted eBook server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard]>=0.165.0",
  "pikepdf>=10.18.2",
  "pymupdf>=2.2",
  "pymupdf4llm>=2.2",
  "requests>=2.34.2",
  "soundfile>=0.14.0",
  "sqlalchemy>=2.1.9",
  "xxhash>=4.1.0",
  "kokoro-onnx>=0.6.1",
  "pytest>=9.2.0",
  "sentencex>=1.0.36",
  "ebooklib>=0.21",
  "watchfiles>=1.3.0",
]

[dependency-groups]
dev = [
    "scalar-fastapi>=1.10.1",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body"
]
